services:
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: gesit-web-dev
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - app
    networks:
      - gesit-net

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gesit-app-dev
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./src/api:/var/www/html/api
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gesit-net

  db:
    image: mariadb:10.11
    container_name: gesit-db-dev
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./database/db_inventaris.sql:/docker-entrypoint-initdb.d/db_inventaris.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gesit-net

volumes:
  db_data_dev:

networks:
  gesit-net:
    driver: bridge