services:
  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/gesit-web:latest
    container_name: gesit-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    networks:
      - gesit-net

  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/gesit-app:latest
    container_name: gesit-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gesit-net

  db:
    image: mariadb:10.11
    container_name: gesit-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/db_inventaris.sql:/docker-entrypoint-initdb.d/db_inventaris.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gesit-net

volumes:
  db_data:

networks:
  gesit-net:
    driver: bridge